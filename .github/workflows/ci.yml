name: ci

on:
  push:
    paths:
    - "**.m"
    - "**.h"
    - "**.cpp"
    - ".github/workflows/ci.yml"
    - ".github/actions/**.yml"
    - "!scripts/**"
    - "!example/**"

# avoid wasted runs
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  linux-newer:
    # For Matlab >= R2024a
    timeout-minutes: 15
    runs-on: ubuntu-latest

    strategy:
      matrix:
        release: [R2024a, latest]

    steps:
    - &matlab-install
      name: Install MATLAB
      timeout-minutes: 5
      uses: matlab-actions/setup-matlab@v3
      with:
        release: ${{ matrix.release }}
        cache: true

    - &checkout
      uses: actions/checkout@v7

    - &tell-ext
      name: Matlab tell External Language Interface versions
      uses: matlab-actions/run-command@v3
      with:
        command: stdlib.doctor()

    - &code-issues
      name: Check codeIssues
      if: ${{ matrix.release >= 'R2024a' || startsWith(matrix.release, 'latest') }}
      uses: matlab-actions/run-build@v3
      with:
        tasks: check
    # Matlab < R2024a has false positives that would break tests

    - &test-main
      name: Main Tests
      uses: ./.github/actions/composite-nomex

    - &test-exe
      name: Exe Tests
      uses: ./.github/actions/composite-exe
      env:
        LD_PRELOAD: /usr/lib/x86_64-linux-gnu/libstdc++.so.6


  macos:
    needs: linux-newer
    timeout-minutes: 15
    runs-on: macos-latest

    strategy:
      matrix:
        release: [R2025b, latest]

# macOS:
#   Matlab >= R2023b compatible with Xcode 15
#   Matlab >= R2024b compatible with Xcode 16

    steps:
    - *matlab-install

    - &mac-fc
      name: Fortran FC
      if: runner.os == 'macOS'
      run: echo "FC=gfortran-15" >> $GITHUB_ENV

    - *checkout

    - *tell-ext

    - *test-main
    - *test-exe


  windows:
    timeout-minutes: 15
    runs-on: windows-latest

    strategy:
      matrix:
        release: [R2025b, latest]
# R2024b on GHA isn't setup with compilers, but R2025b is on GHA

    steps:
    - *matlab-install
    - *checkout
    - *tell-ext

    - *test-main
    - *test-exe


# R2021a, R2022a, R2022b, R2023a, R2023b works, saving CI resources
